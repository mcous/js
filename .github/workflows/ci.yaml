name: Continuous integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup
      - run: pnpm run all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-artifact
          path: packages/*/dist

  publish:
    name: Publish
    if: ${{ github.event_name == 'push' && github.repository == 'mcous/js' && github.ref == 'refs/heads/main' }}
    needs: [check]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # mint OIDC token for npm trusted publishing

    outputs:
      report: ${{ steps.publish-report.outputs.report }}

    steps:
      - *checkout
      - uses: ./actions/setup
        with:
          registry-url: https://registry.npmjs.org
          run-install: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-artifact
          path: packages
      - run: pnpm publish --recursive --report-summary
      - id: publish-report
        run: |
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          cat pnpm-publish-summary.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub releases and tags

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PUBLISH_REPORT: ${{ needs.publish.outputs.report }}
        with:
          script: |
            const { sha: target_commitish } = context
            const { repo, owner } = context.repo
            const publishReport = JSON.parse(process.env.PUBLISH_REPORT)

            for (const { name, version } of publishReport.publishedPackages) {
              const tag_name = `${name}@${version}`
              github.rest.repos.createRelease({ owner, repo, tag_name, target_commitish })
            }
